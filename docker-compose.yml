# Batas ukuran log tiap container: maksimal 10 MB per file, 3 file bergilir (total <= 30 MB).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging
    networks:
      - pustaka-net

  backend:
    build: ./backend
    image: pustaka-backend:1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Pustaka Mini
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stdout
      LOG_LEVEL: info
    command: sh -c "php artisan migrate --force && exec frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile"
    ports:
      - "8000:8000"
    # Memanggil /api/health sungguhan: 200 = sehat, 503 = db atau cache bermasalah.
    # file_get_contents() mengembalikan false pada status 4xx/5xx, sehingga check gagal.
    healthcheck:
      test: ["CMD", "php", "-r", "ini_set('default_socket_timeout', 4); exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks:
      - pustaka-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: pustaka-frontend:1.0
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    networks:
      - pustaka-net

  # ---------------------------------------------------------------- Pemantauan (P11)
  # Versi image dikunci (bukan :latest) supaya hasilnya sama di setiap mesin.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # hanya bisa dibuka dari komputer sendiri
    depends_on:
      - cadvisor
      - node-exporter
      - backend
    logging: *default-logging
    networks:
      - pustaka-net

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Password diambil dari .env (tidak ikut ter-commit); compose berhenti bila kosong.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?isi GRAFANA_ADMIN_PASSWORD di file .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    logging: *default-logging
    networks:
      - pustaka-net

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    # cAdvisor membaca cgroup dan data Docker milik host, jadi perlu mount read-only
    # dan privileged agar bisa menghitung per container (khususnya di Docker Desktop).
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    logging: *default-logging
    networks:
      - pustaka-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro
    logging: *default-logging
    networks:
      - pustaka-net

volumes:
  db_data:
  prometheus_data:
  grafana_data:

networks:
  pustaka-net:
