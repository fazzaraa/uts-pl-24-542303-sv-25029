global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus memantau dirinya sendiri.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Pemakaian CPU/memori tiap container (cAdvisor).
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Pemakaian sumber daya mesin host/VM Docker (node-exporter).
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Metrik aplikasi sendiri: jumlah permintaan API menurut kelas status.
  - job_name: backend
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]
